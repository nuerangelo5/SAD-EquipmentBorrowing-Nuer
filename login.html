<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login - Equipment Borrowing System</title>
  <link rel="stylesheet" href="css/style.css">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>
  <div class="login-container">
    <h1>Equipment Borrowing System</h1>
    <p>Online Equipment Borrowing and Return Monitoring</p>
    
    <div id="alert" class="alert"></div>
    
    <form id="loginForm">
      <div class="form-group">
        <label for="email">Email</label>
        <input type="email" id="email" required placeholder="Enter your email">
      </div>
      <div class="form-group">
        <label for="password">Password</label>
        <input type="password" id="password" required placeholder="Enter your password">
      </div>
      <button type="submit" class="btn btn-primary" style="width:100%; margin-top:10px;">Login</button>
    </form>
    
    <p style="margin-top:20px; font-size:12px; color:#888; text-align:center;">
      Use the account you created in Supabase Authentication
    </p>
  </div>

  <script src="js/supabase.js"></script>
  <script src="js/auth.js"></script>
  <script>
    // Redirect if already logged in
    (async () => {
      const { data: { session } } = await sb.auth.getSession();
      if (session) window.location.href = 'index.html';
    })();

    document.getElementById('loginForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const email = document.getElementById('email').value;
      const password = document.getElementById('password').value;
      const alertEl = document.getElementById('alert');
      
      try {
        await login(email, password);
        window.location.href = 'index.html';
      } catch (err) {
        alertEl.textContent = err.message || 'Login failed. Please check your credentials.';
        alertEl.className = 'alert alert-error show';
      }
    });
  </script>
</body>
</html>
